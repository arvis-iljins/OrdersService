services:
  ordersservice:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5080:8080"
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB_NAME=OrdersDatabase
      - UsersMicroservice__Host=usersservice
      - UsersMicroservice__Port=8080
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - orders-network

  mongodb:
    image: mongo:latest
    ports:
      - "27018:27017"
    volumes:
      - ../OrdersDb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orders-network

networks:
  orders-network:
    driver: bridge
